name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and API tests
        run: npm test
      - name: Build and typecheck
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        run: npm run test:browser
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
